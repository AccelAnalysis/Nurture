name: Release 1 validation toolchain
on:
  push:
    branches: [release/1-integration]
    paths: [.github/workflows/release-1-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated web and Functions dependencies
        run: |
          mkdir -p /tmp/r1-deps/web /tmp/r1-deps/functions
          git show d02744a581a12c8a1934edc507d1709d14a0ec3e:package.json > /tmp/r1-deps/web/package.json
          git show d7596600ea1828bc4825251349d96475e344176d:functions/package.json > /tmp/r1-deps/functions/package.json
          npm install --prefix /tmp/r1-deps/web --no-audit --no-fund
          npm install --prefix /tmp/r1-deps/functions --no-audit --no-fund
          tar -C /tmp/r1-deps -czf /tmp/r1-validation-dependencies.tgz web/node_modules web/package-lock.json functions/node_modules functions/package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: r1-validation-dependencies
          path: /tmp/r1-validation-dependencies.tgz
          retention-days: 1
