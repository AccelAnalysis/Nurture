name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/1-integration
      - release/2-integration

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck web
        run: npm run typecheck

      - name: Platform and integration contracts
        run: npm test

      - name: Experience contract
        run: npm run test:experience

      - name: Analytics contract
        run: npx tsc -p tsconfig.analytics.json && node scripts/verify-analytics-contract.mjs

      - name: Build web
        run: npm run build

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Typecheck Functions
        working-directory: functions
        run: npm run typecheck

      - name: Test Functions
        working-directory: functions
        run: npm test

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Verify production-bundle browser behavior
        run: npm run test:browser

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-2-browser-evidence
          path: test-results/release-2
          if-no-files-found: ignore
