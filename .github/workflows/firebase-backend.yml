name: Firebase Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase-backend.yml'

permissions:
  contents: read

concurrency:
  group: nurture-production-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run test:experience
      - run: npx tsc -p tsconfig.analytics.json && node scripts/verify-analytics-contract.mjs
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npm --prefix functions run typecheck && npm --prefix functions test
      - name: Validate Firebase configuration
        run: npx -y firebase-tools@latest --version && node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'));JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"

  deploy-firestore:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy Firestore rules and indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx -y firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project nurture-12398 --non-interactive

  deploy-functions:
    needs: [verify, deploy-firestore]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
      - name: Deploy Release 2 Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx -y firebase-tools@latest deploy --only functions --project nurture-12398 --non-interactive
      - name: Verify deployed Functions inventory
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          npx -y firebase-tools@latest functions:list --project nurture-12398 --json > /tmp/functions.json
          node - <<'NODE'
          const r=require('/tmp/functions.json');
          const text=JSON.stringify(r);
          for (const name of ['appendLifecycleEvent','recordExperienceMilestone','projectLifecycleEvent','enrollAcquisitionFromLifecycle','drainAcquisitionJobs']) {
            if (!text.includes(name)) throw new Error(`Missing deployed function: ${name}`);
          }
          console.log('Release 2 backend Functions are present.');
          NODE

  backend-status:
    needs: [deploy-firestore, deploy-functions]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize activation boundary
        run: |
          echo "Firestore deployment: ${{ needs.deploy-firestore.result }}"
          echo "Functions deployment: ${{ needs.deploy-functions.result }}"
          echo "Outbound acquisition remains paused by default; provider activation is a separate acceptance gate."
          test "${{ needs.deploy-firestore.result }}" = "success"
          test "${{ needs.deploy-functions.result }}" = "success"
