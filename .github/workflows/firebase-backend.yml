name: Firebase Backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'shared/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - '.github/workflows/firebase-backend.yml'

permissions:
  contents: read

concurrency:
  group: nurture-production-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck && npm test && npm run test:release3 && npm run test:release4 && npm run test:experience
      - run: npx tsc -p tsconfig.analytics.json && node scripts/verify-analytics-contract.mjs
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npm --prefix functions run typecheck && npm --prefix functions test
      - name: Validate Firebase configuration
        run: npx -y firebase-tools@latest --version && node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'));JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"

  deploy-firestore:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate Google Cloud deploy principal
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: nurture-12398
      - name: Verify deployment identity and Service Usage access
        run: |
          set -euo pipefail
          EXPECTED_EMAIL="$(node -e "const j=JSON.parse(process.env.SA_JSON); process.stdout.write(j.client_email)")"
          ACTIVE_EMAIL="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          echo "Active deployment account: ${ACTIVE_EMAIL}"
          echo "Active Google Cloud project: ${ACTIVE_PROJECT}"
          test "${ACTIVE_EMAIL}" = "${EXPECTED_EMAIL}"
          test "${ACTIVE_PROJECT}" = "nurture-12398"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          curl -fsS \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://serviceusage.googleapis.com/v1/projects/nurture-12398/services/firestore.googleapis.com" \
            > /tmp/firestore-service.json
          FIRESTORE_STATE="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/firestore-service.json','utf8')); process.stdout.write(x.state || '')")"
          echo "Firestore API state: ${FIRESTORE_STATE}"
          test "${FIRESTORE_STATE}" = "ENABLED"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}
      - name: Deploy Firestore rules and indexes
        run: npx -y firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project nurture-12398 --non-interactive

  deploy-functions:
    needs: [verify, deploy-firestore]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Authenticate Google Cloud deploy principal
        id: google-auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: nurture-12398
      - name: Verify deployment identity and required APIs
        run: |
          set -euo pipefail
          EXPECTED_EMAIL="$(node -e "const j=JSON.parse(process.env.SA_JSON); process.stdout.write(j.client_email)")"
          ACTIVE_EMAIL="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          ACTIVE_PROJECT="$(gcloud config get-value project 2>/dev/null)"
          echo "Active deployment account: ${ACTIVE_EMAIL}"
          echo "Active Google Cloud project: ${ACTIVE_PROJECT}"
          test "${ACTIVE_EMAIL}" = "${EXPECTED_EMAIL}"
          test "${ACTIVE_PROJECT}" = "nurture-12398"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          for api in cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com pubsub.googleapis.com cloudscheduler.googleapis.com secretmanager.googleapis.com; do
            curl -fsS \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "https://serviceusage.googleapis.com/v1/projects/nurture-12398/services/${api}" \
              > /tmp/service.json
            state="$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/service.json','utf8')); process.stdout.write(x.state || '')")"
            echo "$api: $state"
            test "$state" = "ENABLED"
          done
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}
      - name: Verify Release 4 feedback token secret readiness
        run: |
          set -euo pipefail
          gcloud secrets describe R4_FEEDBACK_TOKEN_KEY_V1 --project nurture-12398 --format='value(name)' > /tmp/r4-secret-name
          test -s /tmp/r4-secret-name
          ENABLED_VERSION="$(gcloud secrets versions list R4_FEEDBACK_TOKEN_KEY_V1 --project nurture-12398 --filter='state=ENABLED' --format='value(name)' --limit=1)"
          test -n "${ENABLED_VERSION}"
          echo "Release 4 feedback token secret has an enabled version."
      - name: Deploy integrated Release 4 Functions
        run: npx -y firebase-tools@latest deploy --only functions --project nurture-12398 --non-interactive
      - name: Verify deployed Functions inventory
        run: |
          npx -y firebase-tools@latest functions:list --project nurture-12398 --json > /tmp/functions.json
          node - <<'NODE'
          const r=require('/tmp/functions.json');
          const text=JSON.stringify(r);
          for (const name of [
            'appendLifecycleEvent','recordExperienceMilestone','projectLifecycleEvent','enrollAcquisitionFromLifecycle','drainAcquisitionJobs',
            'r3GetLifecycleStudio','r3SaveAutomationDraft','r3PublishAutomationDefinition','r3DryRunAutomationDefinition','r3SetLifecycleRuntimeControl',
            'r3ExecuteRecoveryCommand','r3GetCustomerLifecycleControl','r3SetCustomerLifecyclePreferences','r3RequestCancellation',
            'r3GetInAppTreatment','r3RecordInAppTreatmentInteraction','r3ProjectLifecycleEvent','r3DrainLifecycleRuns',
            'feedbackCommand','r4GetFeedbackRuntimeControl','r4SetFeedbackRuntimeControl','r4QualifyReferralOnSubscription'
          ]) {
            if (!text.includes(name)) throw new Error(`Missing deployed function: ${name}`);
          }
          console.log('Release 1-4 backend Functions are present.');
          NODE

  backend-status:
    needs: [deploy-firestore, deploy-functions]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize activation boundary
        run: |
          echo "Firestore deployment: ${{ needs.deploy-firestore.result }}"
          echo "Functions deployment: ${{ needs.deploy-functions.result }}"
          echo "Release 4 feedback runtime remains paused by default; outbound feedback/referral messaging and live incentives remain disabled until separately activated."
          test "${{ needs.deploy-firestore.result }}" = "success"
          test "${{ needs.deploy-functions.result }}" = "success"
