name: Release 1 backend preflight
on:
  push:
    branches: [release/1-integration]
    paths: [.github/workflows/release-1-backend-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}'
      - name: Enable required Firestore API in existing project
        continue-on-error: true
        run: gcloud services enable firestore.googleapis.com --project=nurture-12398 --quiet
      - name: Inspect database edition without creating a database
        continue-on-error: true
        run: gcloud firestore databases list --project=nurture-12398 --quiet --format='json(name,type,databaseEdition,locationId)'
      - name: Inspect Functions availability
        continue-on-error: true
        run: gcloud functions list --project=nurture-12398 --quiet --format='json(name,state,environment)'
      - name: Inspect enabled identity providers and authorized domains
        continue-on-error: true
        shell: bash
        run: |
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" https://identitytoolkit.googleapis.com/admin/v2/projects/nurture-12398/config | jq '{name, authorizedDomains, signIn}'
