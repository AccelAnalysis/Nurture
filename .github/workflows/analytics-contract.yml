name: Analytics Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile analytics contract
        run: |
          rm -rf .tmp/analytics
          npx tsc -p tsconfig.analytics.json

      - name: Verify analytics contract
        run: node scripts/verify-analytics-contract.mjs
