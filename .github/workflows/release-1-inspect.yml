name: Release 1 inspection
on:
  push:
    branches: [release/1-integration]
    paths: [.github/workflows/release-1-inspect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive repository objects without credentials
        run: |
          git bundle create /tmp/nurture-release-1.bundle --all
          git log --all --oneline -20
      - uses: actions/upload-artifact@v4
        with:
          name: nurture-release-1-source
          path: /tmp/nurture-release-1.bundle
          retention-days: 3
      - name: Authenticate for read-only project inspection
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NURTURE_12398 }}'
      - name: Read existing database metadata only
        continue-on-error: true
        run: gcloud firestore databases list --project=nurture-12398 --format='json(name,type,databaseEdition,locationId)'
      - name: Inspect Hosting sites only
        continue-on-error: true
        run: npx -y firebase-tools@latest hosting:sites:list --project nurture-12398 --json
